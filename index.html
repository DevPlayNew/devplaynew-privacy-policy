<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devplaynew — 앱 지원 센터</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 700px; margin: 0 auto; padding: 48px 20px 80px; color: #1c1c1e; line-height: 1.8; background: #fff; }
h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
h2 { font-size: 18px; font-weight: 600; margin-top: 40px; margin-bottom: 8px; }
h3 { font-size: 15px; font-weight: 600; margin-top: 24px; margin-bottom: 4px; }
p, li { font-size: 15px; color: #3a3a3c; }
ul { padding-left: 20px; }
li { margin-bottom: 4px; }
a { color: #5b4ad6; text-decoration: none; }
a:hover { text-decoration: underline; }
hr { border: none; border-top: 1px solid #e5e5ea; margin: 48px 0; }
footer { margin-top: 64px; font-size: 13px; color: #8e8e93; }
.brand { font-size: 13px; color: #8e8e93; margin-bottom: 2px; letter-spacing: 0.02em; text-transform: uppercase; }
.date { font-size: 14px; color: #8e8e93; margin-top: 6px; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #5b4ad6; margin-bottom: 32px; }
.contact-btn { display: inline-block; padding: 9px 16px; background: #f4f1ff; border-radius: 10px; color: #5b4ad6; font-weight: 600; font-size: 15px; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
th { text-align: left; padding: 8px 10px; background: #f2f2f7; font-weight: 600; color: #3a3a3c; border-bottom: 1px solid #e5e5ea; }
td { padding: 8px 10px; border-bottom: 1px solid #f2f2f7; color: #3a3a3c; vertical-align: top; }
.notice { background: #fff9e6; border-left: 3px solid #ffcc00; border-radius: 0 8px 8px 0; padding: 12px 16px; margin: 16px 0; font-size: 14px; color: #3a3a3c; }
.notice-red { background: #fff2f2; border-left-color: #ff3b30; }
    .app-list { display: flex; flex-direction: column; gap: 14px; margin-top: 32px; }
    .app-card { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border: 1.5px solid #e5e5ea; border-radius: 14px; text-decoration: none; color: #1c1c1e; transition: background 0.15s; }
    .app-card:hover { background: #f5f5f7; text-decoration: none; }
    .app-card-left { display: flex; align-items: center; gap: 14px; }
    .app-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .dot-byulbam { background: #5b4ad6; }
    .dot-danggil { background: #30d158; }
    .app-name { font-size: 17px; font-weight: 600; }
    .app-desc { font-size: 13px; color: #8e8e93; margin-top: 2px; }
    .arrow { color: #c7c7cc; font-size: 18px; }
  </style>
</head>
<body>
  <p class="brand">devplaynew</p>
  <h1>앱 지원 센터</h1>
  <p style="color:#6e6e73; font-size:15px; margin-top:6px;">앱을 선택하면 지원 FAQ와 개인정보처리방침을 확인할 수 있습니다.</p>
  <p class="date">문의: <a href="mailto:banwith7@gmail.com">banwith7@gmail.com</a></p>

  <div class="app-list">
    <a class="app-card" href="./byulbam">
      <div class="app-card-left">
        <span class="app-dot dot-byulbam"></span>
        <div>
          <div class="app-name">별밤라디오</div>
          <div class="app-desc">라디오 감성 편지 앱 · iOS</div>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>
    <a class="app-card" href="./danggil">
      <div class="app-card-left">
        <span class="app-dot dot-danggil"></span>
        <div>
          <div class="app-name">너당내동</div>
          <div class="app-desc">당뇨인 외식 메뉴 추천 · iOS</div>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>
  </div>

  <footer>© 2026 devplaynew · <a href="mailto:banwith7@gmail.com">banwith7@gmail.com</a></footer>
</body>
</html>
